<text x="349.6" y="264.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="349.6" dy="0.0">lands in A for sentence 1, in C for sentence 2</tspan></text>
<text x="0.0" y="298.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="0.0" dy="0.0">Illustrative probabilities, not measured. Simplified: one draw shown; the real sampler</tspan></text>
<text x="0.0" y="316.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="0.0" dy="0.0">draws one random number per vocabulary entry.</tspan></text>
