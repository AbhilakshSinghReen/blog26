<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img"><title>The same random draw lands on different tokens when the probabilities change</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa1ad"/></marker></defs>
<rect width="720" height="330" fill="#0d0f13"/>
<text x="0.0" y="99.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e8eaee" text-anchor="start"><tspan x="0.0" dy="0.0">Sentence 1</tspan></text>
<rect x="140.0" y="70.0" width="222.0" height="44.0" rx="4" fill="#3987e5"/>
<rect x="137.0" y="67.0" width="228.0" height="50.0" rx="6" fill="none" stroke="#e8eaee" stroke-width="2"/>
<text x="146.0" y="61.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e8eaee" text-anchor="start"><tspan x="146.0" dy="0.0">A 40%</tspan></text>
<rect x="364.0" y="70.0" width="138.0" height="44.0" rx="4" fill="#d95926"/>
<text x="370.0" y="61.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="370.0" dy="0.0">B 25%</tspan></text>
<rect x="504.0" y="70.0" width="110.0" height="44.0" rx="4" fill="#199e70"/>
<text x="510.0" y="61.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="510.0" dy="0.0">C 20%</tspan></text>
<rect x="616.0" y="70.0" width="82.0" height="44.0" rx="4" fill="#c98500"/>
<text x="622.0" y="61.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="622.0" dy="0.0">D 15%</tspan></text>
<text x="0.0" y="199.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#e8eaee" text-anchor="start"><tspan x="0.0" dy="0.0">Sentence 2</tspan></text>
<rect x="140.0" y="170.0" width="65.2" height="44.0" rx="4" fill="#3987e5"/>
<text x="146.0" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="146.0" dy="0.0">A 12%</tspan></text>
<rect x="207.2" y="170.0" width="65.2" height="44.0" rx="4" fill="#d95926"/>
<text x="213.2" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="213.2" dy="0.0">B 12%</tspan></text>
<rect x="274.4" y="170.0" width="283.6" height="44.0" rx="4" fill="#199e70"/>
<rect x="271.4" y="167.0" width="289.6" height="50.0" rx="6" fill="none" stroke="#e8eaee" stroke-width="2"/>
<text x="280.4" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e8eaee" text-anchor="start"><tspan x="280.4" dy="0.0">C 51%</tspan></text>
<rect x="560.0" y="170.0" width="138.0" height="44.0" rx="4" fill="#c98500"/>
<text x="566.0" y="161.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="400" fill="#9aa1ad" text-anchor="start"><tspan x="566.0" dy="0.0">D 25%</tspan></text>
<line x1="341.6" y1="46.0" x2="341.6" y2="228.0" stroke="#e8eaee" stroke-width="2" stroke-dasharray="6 4"/>
